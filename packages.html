<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tour Packages — Travell Kichwa</title>
  <meta name="description" content="Browse handcrafted tour packages across India and abroad — Ladakh, Kashmir, Kerala, Dubai, Bali and more. Filter by budget, duration and trip type.">
  <meta name="theme-color" content="#FBF7F1">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Jost:wght@400;500;600;700&family=Mr+Dafoe&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body data-page="packages">

<main id="main">
  <section class="page-hero">
    <img id="phImg" alt="">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><i class="ri-arrow-right-s-line"></i><span id="phCrumb">Packages</span></nav>
      <h1 id="phTitle">Tour <span class="script">packages</span></h1>
      <p id="phSub">Handcrafted trips across India and abroad — every route driven, every stay slept in by our team.</p>
    </div>
  </section>

  <section class="section-sm">
    <div class="container listing">
      <aside class="filters" id="filters" aria-label="Filters">
        <div class="filters-head"><h3>Filters</h3><button class="icon-btn bordered" type="button" data-close-filters aria-label="Close filters"><i class="ri-close-line"></i></button></div>

        <div class="filter-group">
          <h4>Region</h4>
          <div class="segmented" id="fRegion">
            <button type="button" data-v="" class="is-active">All</button>
            <button type="button" data-v="india">India</button>
            <button type="button" data-v="intl">Abroad</button>
          </div>
        </div>
        <div class="filter-group">
          <h4>Destination <button type="button" data-clear="dest">Clear</button></h4>
          <div class="filter-list" id="fDest"></div>
        </div>
        <div class="filter-group">
          <h4>Trip type <button type="button" data-clear="type">Clear</button></h4>
          <div class="filter-list" id="fType"></div>
        </div>
        <div class="filter-group">
          <h4>Duration</h4>
          <div class="filter-list" id="fDur"></div>
        </div>
        <div class="filter-group">
          <h4>Budget <small class="muted" style="font-family:var(--ff-body);font-weight:500;font-size:13px">per person</small></h4>
          <input type="range" class="range" id="fPrice" min="5000" max="180000" step="1000" aria-label="Maximum budget per person">
          <div class="range-val"><span>₹5k</span><strong id="fPriceVal">Any budget</strong><span>₹1.8L</span></div>
        </div>
        <div class="filter-group">
          <h4>Guest rating</h4>
          <div class="filter-list" id="fRating"></div>
        </div>
        <div class="filters-apply"><button class="btn btn-primary btn-block" type="button" data-close-filters>Show <span id="applyCount">0</span> trips</button></div>
      </aside>

      <div>
        <div class="toolbar">
          <div class="input-wrap"><i class="ri-search-line"></i><input class="input" type="search" id="fQ" placeholder="Search trips, places or activities…" aria-label="Search trips"></div>
          <select class="select" id="fSort" aria-label="Sort by">
            <option value="popular">Sort: Most popular</option>
            <option value="price-asc">Price: Low to high</option>
            <option value="price-desc">Price: High to low</option>
            <option value="rating">Top rated</option>
            <option value="duration">Shortest first</option>
          </select>
          <button class="btn btn-outline btn-filters" type="button" id="openFilters"><i class="ri-equalizer-2-line"></i>Filters</button>
        </div>
        <div class="results-meta">
          <p class="results-count" id="resCount" aria-live="polite"></p>
          <div class="active-filters" id="activeFilters"></div>
        </div>
        <div class="pkg-grid" id="results"></div>
      </div>
    </div>
  </section>
</main>
<div class="scrim" id="scrim"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/packages.js"></script>
</body>
</html>
